    <path d="M22 12C14 4 16-6 24-10C30-13 37-9 39-2C42 7 33 15 22 12Z" fill="#FFB4CC"/>
    <path d="M11 23C3 15 5 5 13 1C19-2 26 2 28 9C31 18 22 26 11 23Z" fill="#FFB4CC"/>
    <circle cx="19" cy="7" r="6" fill="#FFF2BA"/>
