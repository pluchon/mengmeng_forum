# 萌萌论坛 — Docker Compose 生产/本地栈
# 使用前：构建前端 dist、后端镜像，见 README.md

services:

  nginx:
    image: nginx:1.30.1
    container_name: forum-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./dist/user:/usr/share/nginx/user:ro
      - ${FORUM_LOG_DIR:-../logs}/nginx:/var/log/nginx
    depends_on:
      backend-1:
        condition: service_healthy
    healthcheck:
      # 官方 nginx 镜像无 wget/curl，用进程检测（/healthz 仍由 conf.d 提供）
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - forum-net

  backend-1:
    image: ${FORUM_BACKEND_IMAGE:-forum-backend:latest}
    container_name: forum-backend-1
    restart: unless-stopped
    environment: &backend_env
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/forum_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-forum_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-nuonuo}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-123456}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-forum-demo}
      FORUM_AI_HUB_BASE_URL: http://ai-server:5000
      FORUM_MASCOT_AI_URL: http://ai-server:5000/api/v1/gateway/invoke
      FORUM_MASCOT_INTERNAL_KEY: ${FORUM_MASCOT_INTERNAL_KEY:-}
      FORUM_AI_INTERNAL_KEY: ${FORUM_AI_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
      FORUM_FFMPEG_INTERNAL_KEY: ${FORUM_FFMPEG_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
      FORUM_VOICE_STUN_URLS: ${FORUM_VOICE_STUN_URLS:-stun:turn.nuonuoya.cn:3478}
      FORUM_VOICE_TURN_URLS: ${FORUM_VOICE_TURN_URLS:-}
      FORUM_VOICE_TURN_USERNAME: ${FORUM_VOICE_TURN_USERNAME:-}
      FORUM_VOICE_TURN_CREDENTIAL: ${FORUM_VOICE_TURN_CREDENTIAL:-}
      FORUM_VOICE_TURN_SECRET: ${FORUM_VOICE_TURN_SECRET:-}
      FORUM_VOICE_TURN_TTL_SECONDS: ${FORUM_VOICE_TURN_TTL_SECONDS:-3600}
      PII_CRYPTO_SECRET: ${PII_CRYPTO_SECRET:-local_dev_pii_secret_change_before_prod_deploy}
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_change_before_prod_deploy}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-}
      OSS_ROOT_PREFIX: ${OSS_ROOT_PREFIX:-}
      FORUM_FFMPEG_URL: http://ffmpeg:8099
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m}
    healthcheck:
      test: ["CMD-SHELL", "/bin/busybox nc -z 127.0.0.1 8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    volumes:
      - ${FORUM_LOG_DIR:-../logs}/backend:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ffmpeg:
        condition: service_started
    networks:
      - forum-net

  backend-2:
    profiles:
      - dual
    image: ${FORUM_BACKEND_IMAGE:-forum-backend:latest}
    container_name: forum-backend-2
    restart: unless-stopped
    environment: *backend_env
    volumes:
      - ${FORUM_LOG_DIR:-../logs}/backend:/app/logs
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      ai-server:
        condition: service_started
    networks:
      - forum-net

  ai-server:
    build:
      context: ../ai-server
      dockerfile: Dockerfile
    image: ${FORUM_AI_IMAGE:-forum-ai-server:latest}
    container_name: forum-ai-server
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      HUANAPI_IMAGE_KEY: ${HUANAPI_IMAGE_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MASCOT_INTERNAL_KEY: ${FORUM_MASCOT_INTERNAL_KEY:-}
      AI_HUB_INTERNAL_KEY: ${FORUM_AI_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
      AI_REQUIRE_INTERNAL_KEY: ${AI_REQUIRE_INTERNAL_KEY:-1}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-nuonuo}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-123456}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-forum-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-}
      OSS_ROOT_PREFIX: ${OSS_ROOT_PREFIX:-}
      FORUM_FFMPEG_URL: http://ffmpeg:8099
      FORUM_BACKEND_BASE_URL: http://backend-1:8080
    volumes:
      - ${FORUM_LOG_DIR:-../logs}/ai-server:/var/log/forum
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - forum-net

  ffmpeg:
    build:
      context: ./ffmpeg
      dockerfile: Dockerfile
    image: ${FORUM_FFMPEG_IMAGE:-forum-ffmpeg:latest}
    container_name: forum-ffmpeg
    restart: unless-stopped
    environment:
      FFMPEG_INTERNAL_KEY: ${FORUM_FFMPEG_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
      FFMPEG_REQUIRE_INTERNAL_KEY: ${FFMPEG_REQUIRE_INTERNAL_KEY:-1}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-}
      FFMPEG_LOG_FILE: /var/log/forum/ffmpeg.log
    volumes:
      - ${FORUM_LOG_DIR:-../logs}/ffmpeg:/var/log/forum
    networks:
      - forum-net

  mysql:
    image: mysql:9.7.0
    container_name: forum-mysql
    restart: unless-stopped
    # 宿主机端口见 docker-compose.prod.yml（生产）或 docker-compose.dev.yaml（本地）
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_DATABASE: forum_db
      MYSQL_USER: ${MYSQL_USER:-forum_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00"]
    volumes:
      - forum_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456789}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - forum-net

  redis:
    image: redis:8.0
    container_name: forum-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - forum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-net

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: forum-rabbitmq
    hostname: forum-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nuonuo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-forum-demo}
    volumes:
      - forum_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - forum-net

  postgres:
    image: postgres:17
    container_name: forum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    volumes:
      - forum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langgraph} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-net

volumes:
  forum_mysql_data:
  forum_redis_data:
  forum_rabbitmq_data:
  forum_postgres_data:

networks:
  forum-net:
    driver: bridge
