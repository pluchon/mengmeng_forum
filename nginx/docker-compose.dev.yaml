# 本地开发：仅 Docker 中间件（MySQL / Redis / RabbitMQ / PostgreSQL / FFmpeg）
#
# 以下在宿主机自行启动，本文件不包含：
#   - Java 微服务（java-cloud-standalone，经 Gateway :10086）
#   - AI 服务（ai-server）             http://localhost:5000
#   - 用户端 Vite                         dev 端口（如 5173）
# 日志约定（仓库根）：logs/java-backend/  logs/python-backend/  logs/ffmpeg/
#
# 用法（在 nginx 目录下）：
#   docker compose -f docker-compose.dev.yaml up -d
#   docker compose -f docker-compose.dev.yaml up -d --build   # 首次构建 FFmpeg 镜像
#
# 或从仓库根目录：
#   docker compose --project-directory . -f nginx/docker-compose.dev.yaml up -d --build
#
# 宿主机连接（与 backend/application.yml、ai-server/config.yaml 默认一致）：
#   MySQL       127.0.0.1:33306
#   Redis       localhost:63790
#   RabbitMQ    AMQP 56690（56720 在 Windows Hyper-V 保留段内），管理台 http://localhost:25672
#   PostgreSQL  54320
#   FFmpeg      http://localhost:8099  （Java 大文件压缩：FORUM_FFMPEG_URL=http://localhost:8099）

services:

  mysql:
    image: mysql:9.7.0
    container_name: forum-mysql-dev
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-33306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_USER: ${MYSQL_USER:-forum_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00"]
    volumes:
      - forum_dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456789}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - forum-dev-net

  redis:
    image: redis:8.0
    container_name: forum-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-63790}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - forum_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-dev-net

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: forum-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-56690}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-25672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nuonuo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-forum-demo}
    volumes:
      - forum_dev_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - forum-dev-net

  postgres:
    image: postgres:17
    container_name: forum-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-54320}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    volumes:
      - forum_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langgraph} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-dev-net

  ffmpeg:
    build:
      context: ./ffmpeg
      dockerfile: Dockerfile
    image: ${FORUM_FFMPEG_IMAGE:-forum-ffmpeg:latest}
    container_name: forum-ffmpeg-dev
    restart: unless-stopped
    ports:
      - "${FFMPEG_HOST_PORT:-8099}:8099"
    environment:
      FFMPEG_REQUIRE_INTERNAL_KEY: "0"
    networks:
      - forum-dev-net

volumes:
  forum_dev_mysql_data:
  forum_dev_redis_data:
  forum_dev_rabbitmq_data:
  forum_dev_postgres_data:

networks:
  forum-dev-net:
    driver: bridge
