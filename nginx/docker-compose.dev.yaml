# 本地开发：仅启动中间件 + Nginx（MySQL / Redis / PostgreSQL / RabbitMQ / Nginx）
# 后端 Java、AI Python、前端 Vite 在宿主机自行启动。
#
# 用法（在 nginx 目录下）：
#   copy .env.dev.example .env
#   docker compose -f docker-compose.dev.yaml up -d
#
# 宿主机服务默认端口（与 application.yml、ai-server/config.yaml 一致）：
#   Java 后端     http://localhost:10086
#   AI 服务       http://localhost:5000
#   用户端 Vite   http://localhost:5173  （可选，不用 Nginx 静态时）
#   Nginx 入口    http://localhost        （需先 npm run build 生成 dist/）
#   管理端        http://admin.localhost  （hosts 加 127.0.0.1 admin.localhost）
#
# 中间件映射端口（宿主机连接）：
#   MySQL 33061  Redis 63790  RabbitMQ 56720/25672  Postgres 54320

services:

  nginx:
    image: nginx:1.30.1
    container_name: forum-nginx-dev
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      # 勿整目录挂载 conf.d.local，否则无法再挂 snippets 子目录
      - ./conf.d.local/00-core.conf:/etc/nginx/conf.d/00-core.conf:ro
      - ./conf.d.local/10-local-http.conf:/etc/nginx/conf.d/10-local-http.conf:ro
      - ./conf.d/snippets:/etc/nginx/conf.d/snippets:ro
      - ./dist/user:/usr/share/nginx/user:ro
      - ./dist/admin:/usr/share/nginx/admin:ro
      - ./logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - forum-dev-net

  mysql:
    image: mysql:9.7.0
    container_name: forum-mysql-dev
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-33061}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456789}
      MYSQL_DATABASE: forum_db
      MYSQL_USER: ${MYSQL_USER:-forum_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456789}
    volumes:
      - forum_dev_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-123456789}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - forum-dev-net

  redis:
    image: redis:8.0
    container_name: forum-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-63790}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - forum_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-dev-net

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: forum-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_AMQP_PORT:-56720}:5672"
      - "${RABBITMQ_MGMT_PORT:-25672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nuonuo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-forum-demo}
    volumes:
      - forum_dev_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - forum-dev-net

  postgres:
    image: postgres:17
    container_name: forum-postgres-dev
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-54320}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    volumes:
      - forum_dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langgraph} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-dev-net

volumes:
  forum_dev_mysql_data:
  forum_dev_redis_data:
  forum_dev_rabbitmq_data:
  forum_dev_postgres_data:

networks:
  forum-dev-net:
    driver: bridge
