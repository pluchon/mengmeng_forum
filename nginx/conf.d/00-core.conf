# 全局：upstream / map / gzip / 限流（挂载于 conf.d，位于 http 上下文）

access_log off;
error_log /var/log/nginx/error.log warn;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker Compose 服务名；Nginx 只进入 Gateway，由 Gateway 通过 Nacos 路由到各业务域。
upstream forum_backend {
    least_conn;
    server gateway:10086 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# WebSocket 也由 Gateway 转发到 IM / game 域。
upstream forum_backend_ws {
    server gateway:10086 max_fails=3 fail_timeout=30s;
}

map $request_uri $is_forum_api {
    default 0;
    ~*^/(user|board|article|articleQuestion|articleDanmaku|message|mail|sms|category|like|file|articleReply|articleSubReply|replyLike|checkin|shop|points|favorite|search|system-message|mascot|lottery|vip|game|growth|profile|recommend|ai|notice|captcha|drift-bottle|group-chat|voice)(/|$) 1;
}

# 浏览器地址栏刷新/直达：Accept 含 text/html 时走 SPA，勿误转发 Java（否则 LoginInterceptor 401）
map $http_accept $accepts_html {
    default 0;
    ~*text/html 1;
}

map $request_method $is_mutating_method {
    default 0;
    POST    1;
    PUT     1;
    PATCH   1;
    DELETE  1;
}

map "$is_forum_api:$accepts_html:$is_mutating_method" $proxy_forum_api {
    default 0;
    ~^1:0:1$ 1;
    ~^1:0:0$ 1;
    ~^1:1:0$ 0;
}

limit_req_zone $binary_remote_addr zone=forum_api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=forum_auth:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=forum_public_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=forum_public_search:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=forum_captcha_challenge:10m rate=10r/m;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    text/xml
    image/svg+xml;
