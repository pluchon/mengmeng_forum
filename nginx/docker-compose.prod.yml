# Production overlay: bind middleware to 127.0.0.1 on host + memory limits
# Usage: docker compose -f docker-compose.yaml -f docker-compose.prod.yml up -d
#
# 宿主机（SSH 隧道）默认端口：MySQL 33061  Redis 63790  Postgres 54320  RabbitMQ 56720/15672

services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-33061}:3306"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-63790}:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-56720}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"

  nginx:
    pull_policy: never

  backend-1:
    image: ${FORUM_BACKEND_IMAGE:-forum-backend:latest}
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M

  ai-server:
    image: ${FORUM_AI_IMAGE:-forum-ai-server:latest}
    pull_policy: never
    build: !reset null
    deploy:
      resources:
        limits:
          memory: 768M

  ffmpeg:
    image: ${FORUM_FFMPEG_IMAGE:-forum-ffmpeg:latest}
    pull_policy: never
    build: !reset null
