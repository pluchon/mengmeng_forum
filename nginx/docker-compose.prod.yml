# 生产覆盖：中间件仅绑定本机，Java 域服务按职责设置内存上限。

services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-33061}:3306"

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-63790}:6379"

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-56720}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"

  nginx:
    pull_policy: never

  gateway:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 512M

  auth:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M

  content:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M

  im:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M

  game:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 1024M

  economy:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M

  ai:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M

  ai-server:
    pull_policy: never
    build: !reset null
    deploy:
      resources:
        limits:
          memory: 768M

  ffmpeg:
    pull_policy: never
    build: !reset null

  nacos:
    pull_policy: never
    deploy:
      resources:
        limits:
          memory: 768M
