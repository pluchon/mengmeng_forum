spring:
  main:
    banner-mode: off
    # Feign 客户端创建依赖 MVC，而 LoginInterceptor → AuthSnapshot → Feign 形成启动环；@Lazy + 本开关兜底
    allow-circular-references: true
  cloud:
    nacos:
      discovery:
        # 本地多网卡环境可通过 Windows 用户变量 NACOS_DISCOVERY_IP 显式指定可达地址；Docker 未设置时保持 Nacos 自动探测容器地址
        ip: ${NACOS_DISCOVERY_IP:}
  # 本地 Java 只读进程环境、classpath 默认值和显式导入的 Nacos 配置。
  data:
    redis:
      # Windows 上 localhost 常解析到 ::1，而 Docker 端口仅绑 127.0.0.1
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: 16379
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    # 与 ForumTimeZone.ID 保持一致，改这里要同步改那边
    time-zone: Asia/Taipei
    default-property-inclusion: NON_NULL
  servlet:
    multipart:
      max-file-size: 350MB
      max-request-size: 350MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:56720}
    # 默认 vhost 与历史 forum-demo 兼容；新环境建议显式设置 SPRING_RABBITMQ_VIRTUAL_HOST=forum
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:forum-demo}
    username: ${SPRING_RABBITMQ_USERNAME:nuonuo}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD}}
    listener:
      simple:
        acknowledge-mode: manual
    publisher-confirm-type: correlated
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.pluchon.forum.common.db
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
springdoc:
  swagger-ui:
    path: /swagger
sms:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  sign-name: "速通互联验证码"

oss:
  endpoint: ${OSS_LOCAL_ENDPOINT:https://oss-cn-shenzhen.aliyuncs.com}
  access-key-id: ${OSS_LOCAL_ACCESS_KEY_ID:${ALIYUN_ACCESS_KEY_ID:}}
  access-key-secret: ${OSS_LOCAL_ACCESS_KEY_SECRET:${ALIYUN_ACCESS_KEY_SECRET:}}
  bucket-name: ${OSS_LOCAL_BUCKET_NAME:item-for-picture-with-zhanglihong-local-develop}
  url-prefix: ${OSS_LOCAL_URL_PREFIX:https://item-for-picture-with-zhanglihong-local-develop.oss-cn-shenzhen.aliyuncs.com/}
  # 本地对象 key 根前缀；留空时与 OSS 控制台 forum_xxx/ 根目录对齐。
  root-prefix: ${OSS_LOCAL_ROOT_PREFIX:}
  path: forum_db_item/forum_head_picture/

jwt:
  secret: ${JWT_SECRET}

pii:
  secret: ${PII_CRYPTO_SECRET}

captcha:
  prefix: captcha
  expire:
    default: 120000
    WORD_IMAGE_CLICK: 180000
  init-default-resource: true
  local-cache-enabled: false
  local-cache-size: 20
  local-cache-wait-time: 5000
  local-cache-period: 2000
  local-cache-ignored-cache-fields: ""
  secondary:
    enabled: false
    expire: 120000
    keyPrefix: "captcha:secondary"

forum:
  # Java↔Java /internal/** 共享密钥；生产必须用外部环境变量覆盖
  service:
    internal-key: ${FORUM_SERVICE_INTERNAL_KEY:local-dev-forum-service-key}
  websocket:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  mascot:
    # Flask 只监听 IPv4；localhost 在 Windows 会先解析 ::1 导致连接被拒
    ai-url: ${FORUM_MASCOT_AI_URL:http://127.0.0.1:5000/api/v1/gateway/invoke}
    internal-key: ${FORUM_MASCOT_INTERNAL_KEY:${FORUM_AI_INTERNAL_KEY:}}
    basic-daily-limit: ${FORUM_MASCOT_BASIC_DAILY_LIMIT:30}
    treat-admin-as-vip: ${FORUM_MASCOT_TREAT_ADMIN_AS_VIP:true}
  ai:
    # Flask 只监听 IPv4；localhost 在 Windows 会先解析 ::1 导致连接被拒
    hub-base-url: ${FORUM_AI_HUB_BASE_URL:http://127.0.0.1:5000}
    internal-key: ${FORUM_AI_INTERNAL_KEY:${FORUM_MASCOT_INTERNAL_KEY:}}
    timeout:
      connect-ms: 5000
      fast-ms: 60000
      standard-ms: 300000
      long-ms: 300000
      index-ms: 50000
  ffmpeg:
    internal-key: ${FORUM_FFMPEG_INTERNAL_KEY:${FORUM_MASCOT_INTERNAL_KEY:}}
    connect-timeout-ms: 5000
    read-timeout-ms: 150000
# 本地默认：以 */server 工作目录回到仓库根 logs/java-backend/
# 勿在默认值里再写 ${LOG_FILE:...}，否则会与 Boot 写入的 LOG_FILE 互相抢占。
# 覆盖优先级：环境变量 LOG_FILE（Boot 原生）> FORUM_LOG_FILE > 下方默认路径
# 生产：application-core-prod-defaults.yml 或 Compose 注入 LOG_FILE=/app/logs/...
logging:
  config: classpath:forum-logback-spring.xml
  charset:
    file: UTF-8
  level:
    root: WARN
    org.pluchon.forum: WARN
  file:
    name: ${FORUM_LOG_FILE:${FORUM_LOG_DIR:../../../logs}/java-backend/${spring.application.name}/${spring.application.name}.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
