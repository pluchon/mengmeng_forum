# 仅 spring.profiles.active 含 prod 时生效（由各服务 optional import）
# 容器内日志目录挂载到宿主机 ${FORUM_LOG_DIR}/java-backend
spring:
  config:
    activate:
      on-profile: prod

oss:
  endpoint: ${OSS_SERVER_ENDPOINT:https://oss-cn-shenzhen.aliyuncs.com}
  access-key-id: ${OSS_SERVER_ACCESS_KEY_ID:${ALIYUN_ACCESS_KEY_ID:}}
  access-key-secret: ${OSS_SERVER_ACCESS_KEY_SECRET:${ALIYUN_ACCESS_KEY_SECRET:}}
  bucket-name: ${OSS_SERVER_BUCKET_NAME:item-for-picture-with-zhanglihong}
  url-prefix: ${OSS_SERVER_URL_PREFIX:https://item-for-picture-with-zhanglihong.oss-cn-shenzhen.aliyuncs.com/}
  root-prefix: ${OSS_SERVER_ROOT_PREFIX:}

logging:
  level:
    root: WARN
    org.pluchon.forum: WARN
  file:
    name: ${FORUM_LOG_FILE:/app/logs/${spring.application.name}/${spring.application.name}.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
