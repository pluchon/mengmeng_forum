server:
  port: 10104

spring:
  application:
    name: forum-game
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  config:
    import:
      - optional:classpath:application-core-defaults.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33306/forum_game_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:forum_game}
    password: ${DB_PASSWORD:forum_game_pass}

forum:
  domain: game
  features:
    scheduling: true
    mq-consumer: false
    websocket: false
    game-runtime: true

logging:
  file:
    name: ${LOG_FILE:../logs/forum-game/forum-game.log}
