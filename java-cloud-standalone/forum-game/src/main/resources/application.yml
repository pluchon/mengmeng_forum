server:
  port: 10104

spring:
  application:
    name: forum-game
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  config:
    import:
      - optional:classpath:application-core-defaults.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33306/forum_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}

forum:
  domain: game
  features:
    scheduling: true
    # 内容侧 MQ 仍由 forum-content 消费；对局结束由 GameFinishedMqConsumer（本域）监听
    mq-consumer: false
    # IM 的 /ws/notify 仅由 forum-im 承载；游戏进程只用 game-runtime WebSocket
    websocket: false
    game-runtime: true

logging:
  file:
    name: ${LOG_FILE:../logs/forum-game/forum-game.log}
