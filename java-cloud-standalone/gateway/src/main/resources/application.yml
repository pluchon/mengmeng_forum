server:
  port: 10086

spring:
  application:
    name: forum-gateway
  main:
    banner-mode: off
  config:
    import:
      - optional:nacos:forum-common.yml?group=${NACOS_GROUP:FORUM}&refreshEnabled=false
      - optional:nacos:${spring.application.name}.yml?group=${NACOS_GROUP:FORUM}&refreshEnabled=false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        # 本地多网卡环境可通过 Windows 用户变量指定可由其他宿主服务访问的注册地址；Docker 未设置时自动探测
        ip: ${NACOS_DISCOVERY_IP:}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          httpclient:
            connect-timeout: 5000
            # 普通业务默认 60s；AI 长调用在 forum-ai 路由 metadata 单独放宽
            response-timeout: 60s
          routes:
            - id: forum-auth
              uri: lb://forum-auth
              predicates:
                - Path=/user/**,/captcha/**,/mail/**,/sms/**
            - id: forum-content
              uri: lb://forum-content
              predicates:
                - Path=/article/**,/articleReply/**,/articleSubReply/**,/like/**,/replyLike/**,/articleQuestion/**,/articleDanmaku/**,/board/**,/category/**,/favorite/**,/search/**,/recommend/**,/file/**
            - id: forum-im
              uri: lb://forum-im
              predicates:
                - Path=/message/**,/group-chat/**,/system-message/**,/notice/**
            - id: forum-game
              uri: lb://forum-game
              predicates:
                - Path=/game/**
            - id: forum-economy
              uri: lb://forum-economy
              predicates:
                - Path=/points/**,/checkin/**,/vip/**,/lottery/**,/shop/**,/starlight/**,/bag/**
            - id: forum-ai
              uri: lb://forum-ai
              predicates:
                - Path=/ai/**,/mascot/**
              metadata:
                response-timeout: 320000
                connect-timeout: 5000
            - id: forum-ws-im
              uri: lb:ws://forum-im
              predicates:
                - Path=/ws/notify
            - id: forum-ws-game
              uri: lb:ws://forum-game
              predicates:
                - Path=/ws/game-center/**,/ws/games/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # 网关只做路由与服务发现，不连 MySQL / Redis / RabbitMQ
  health:
    db:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false

logging:
  config: classpath:forum-logback-spring.xml
  charset:
    file: UTF-8
  level:
    root: WARN
    org.springframework.cloud.gateway: WARN
  file:
    # gateway 比 */server 少一层；滚动文件名使用 Boot 解析后的 LOG_FILE
    name: ${FORUM_LOG_FILE:${FORUM_LOG_DIR:../../logs}/java-backend/${spring.application.name}/${spring.application.name}.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
