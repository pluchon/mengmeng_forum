server:
  port: 10086

spring:
  application:
    name: forum-gateway
  config:
    import:
      - optional:nacos:forum-common.yml?group=FORUM&refreshEnabled=false
      - optional:nacos:${spring.application.name}.yml?group=FORUM&refreshEnabled=false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: forum-auth
              uri: lb://forum-auth
              predicates:
                - Path=/user/**,/captcha/**,/mail/**,/sms/**
            - id: forum-content
              uri: lb://forum-content
              predicates:
                - Path=/article/**,/articleReply/**,/articleSubReply/**,/like/**,/replyLike/**,/articleQuestion/**,/articleDanmaku/**,/board/**,/category/**,/favorite/**,/search/**,/recommend/**,/profile/interests/**,/file/**
            - id: forum-im
              uri: lb://forum-im
              predicates:
                - Path=/message/**,/group-chat/**,/voice/**,/system-message/**,/notice/**
            - id: forum-game
              uri: lb://forum-game
              predicates:
                - Path=/game/**
            - id: forum-economy
              uri: lb://forum-economy
              predicates:
                - Path=/points/**,/checkin/**,/vip/**,/lottery/**,/shop/**,/growth/**
            - id: forum-ai
              uri: lb://forum-ai
              predicates:
                - Path=/ai/**,/mascot/**,/drift-bottle/**
            - id: forum-ws-im
              uri: lb:ws://forum-im
              predicates:
                - Path=/ws/notify
            - id: forum-ws-game
              uri: lb:ws://forum-game
              predicates:
                - Path=/ws/game-center/**,/ws/games/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # 网关只做路由与服务发现，不连 MySQL / Redis / RabbitMQ
  health:
    db:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false

logging:
  level:
    root: WARN
    org.springframework.cloud.gateway: WARN
  file:
    # gateway 比 */server 少一层；滚动文件名使用 Boot 解析后的 LOG_FILE
    name: ${FORUM_LOG_FILE:${FORUM_LOG_DIR:../../logs}/java-backend/${spring.application.name}/${spring.application.name}.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
