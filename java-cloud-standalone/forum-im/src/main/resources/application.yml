server:
  port: 10103

spring:
  application:
    name: forum-im
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  config:
    import:
      - optional:classpath:application-core-defaults.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:33306/forum_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}

forum:
  domain: im
  features:
    scheduling: true
    mq-consumer: false
    websocket: true
    game-runtime: false

logging:
  file:
    name: ${LOG_FILE:../logs/forum-im/forum-im.log}
