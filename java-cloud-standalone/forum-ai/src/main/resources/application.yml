server:
  port: 10106

spring:
  application:
    name: forum-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  config:
    import:
      - optional:classpath:application-core-defaults.yml

forum:
  domain: ai
  features:
    scheduling: false
    mq-consumer: false
    websocket: false
    game-runtime: false

logging:
  file:
    name: ${LOG_FILE:../logs/forum-ai/forum-ai.log}
