server:
  port: 10101

spring:
  application:
    name: forum-auth
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  config:
    import:
      - optional:classpath:application-core-defaults.yml
      - optional:classpath:application-core-prod-defaults.yml
  # auth 不发不收 MQ；排除自动装配，避免 RabbitHealthIndicator 去连 Broker
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
  datasource:
    # 用域专属变量，避免全局 DB_PASSWORD/DB_URL 把六个服务密码冲掉
    url: ${FORUM_AUTH_DB_URL:jdbc:mysql://127.0.0.1:33306/forum_auth_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${FORUM_AUTH_DB_USERNAME:forum_auth}
    password: ${FORUM_AUTH_DB_PASSWORD:forum_auth_pass}

management:
  health:
    rabbit:
      enabled: false

forum:
  domain: auth
  features:
    scheduling: false
    mq: false
    mq-consumer: false
    websocket: false
    game-runtime: false
