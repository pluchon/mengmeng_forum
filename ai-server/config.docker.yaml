# Docker Compose 内网服务名（由 nginx/docker-compose 使用）
server:
  host: 0.0.0.0
  port: 5000

logging:
  level: WARNING
  file: /var/log/forum/ai-server.log
  max_bytes: 20971520
  backup_count: 14

dashscope:
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  image_generation_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  model_text: "qwen3.6-flash"
  model_text_flash: "qwen3.6-flash"
  model_text_deep: "qwen3.7-max"
  model_vision: "qwen3-vl-flash"
  model_vision_fallback: "qwen3-vl-plus"
  model_rerank: "qwen3-vl-rerank"
  model_embedding_rag: "qwen3-vl-embedding"
  model_embedding_text_fallback: "text-embedding-v3"
  # 勿将 embedding 配置为 qwen3-vl-rerank；对话走 compatible-mode，向量走 MultiModal/TextEmbedding
  model_image_normal: "z-image-turbo"
  model_image_premium: "wanx2.1-t2i-plus"

redis:
  host: redis
  port: 6379
  password: "123456"
  db: 0
  socket_timeout: 2

rabbitmq:
  host: rabbitmq
  port: 5672
  virtual_host: forum-demo
  username: nuonuo
  password: "123456"
  exchange: "t_exchange_1"
  audit_task_queue: "q-audit-article"
  audit_task_routing_key: "forum.audit.article"
  audit_result_routing_key: "forum.audit.result"
  prefetch: 1

postgres:
  host: postgres
  port: 5432
  user: langgraph
  password: "123456"
  db: langgraph_db
  auto_setup: true

audit:
  max_image_workers: 3
  task_state_key_prefix: "ai_audit:task_state:"
  task_state_ttl: 3600
  image_audit_timeout: 30
  text_audit_timeout: 180
  text_audit_max_chars: 12000
  video_audit_timeout: 300
  video_max_bytes_for_url: 104857600
  video_frame_extract_timeout: 600
  summary_min_len: 50

oss:
  endpoint: https://oss-cn-shenzhen.aliyuncs.com
  access_key_id: ""
  access_key_secret: ""
  bucket_name: ""
  url_prefix: ""
  root_prefix: ""

cache:
  exact_prefix: "ai_audit:cache:exact:"
  list_key: "ai_audit:text_list"
  ttl: 86400
  list_max: 100
  candidate_topk: 50
  semantic_threshold: 0.7

rag:
  redis_article_ids_key: "forum_rag:article:ids"
  redis_article_doc_prefix: "forum_rag:article:"
  redis_user_ids_key: "forum_rag:user:ids"
  redis_user_doc_prefix: "forum_rag:user:"
  vector_scan_limit: 400
  max_candidates: 80
  doc_truncate: 1200
  relevance_threshold: 0.22
  top_n: 40
  rerank_weight: 0.72
  keyword_weight: 0.18
  embedding_weight: 0.10
  embedding_top_k: 50
  min_keyword_overlap: 0.08
  skip_rerank_below: 5
  light_rerank_weight: 0.55
  light_keyword_weight: 0.45
  light_rerank_top_n: 30
  vector_min_score: 0.22
  vector_min_score_user: 0.28
  vector_min_score_user_profile: 0.28
  vector_min_score_user_semantic: 0.40
  mascot_min_score: 0.42
  mascot_relative_to_top: 0.93
  mascot_top_min_to_show: 0.46
  mascot_score_gap: 0.055

image:
  max_bytes: 10485760
  allowed_formats: ["jpeg", "jpg", "png", "gif", "webp", "bmp"]

mascot:
  internal_key: ""
  max_user_message_len: 2000
  max_history_turns: 8

huanapi:
  base_url: "https://www.huanapi.com"
  image_key: ""
  model_image_premium: "gpt-image-2"

tavily:
  enabled: true
  api_key: ""
  max_results: 5
  search_depth: basic
  timeout: 25

mcp:
  enabled: true
  tools:
    - tavily_search
    - get_current_datetime
    - map_geocode
    - map_search_places
    - map_directions
    - map_weather

baidu_map:
  enabled: true
  api_key: ""

ai_hub:
  internal_key: ""

security:
  require_internal_key: true

ffmpeg:
  base_url: http://ffmpeg:8099
  internal_key: ""

forum:
  base_url: "http://backend-1:8080"
  notice_list_path: "/notice/center/list"
  request_timeout: 15
  site_help_cache_ttl: 600
  site_help_max_notice_chars: 4000
