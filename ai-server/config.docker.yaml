# Docker Compose 内网服务名（由 deploy/docker-compose 使用）
server:
  host: 0.0.0.0
  port: 5000

logging:
  level: WARNING
  file: /var/log/forum/ai-server/ai-server.log
  max_bytes: 20971520
  backup_count: 14

gateway:
  fast_concurrency: 8
  standard_concurrency: 4
  long_concurrency: 2
  index_concurrency: 2

dashscope:
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  image_generation_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  model_text: "qwen3.7-flash"
  model_text_flash: "qwen3.7-flash"
  model_text_deep: "qwen3.7-max"
  model_vision: "qwen3-vl-flash"
  model_vision_fallback: "qwen3-vl-plus"
  model_rerank: "qwen3-rerank"
  model_embedding_rag: "qwen3-vl-embedding"
  model_embedding_text_fallback: "text-embedding-v4"
  # 勿将 embedding 配置为 rerank；对话走 compatible-mode，向量走 MultiModal/TextEmbedding
  model_image_normal: "wan2.7-image"
  model_image_premium: "wan2.7-image-pro"

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  socket_timeout: 2

rabbitmq:
  host: rabbitmq
  port: 5672
  virtual_host: forum-demo
  username: nuonuo
  password: ""
  exchange: "t_exchange_1"
  audit_task_queue: "q-audit-article"
  audit_task_routing_key: "forum.audit.article"
  audit_result_routing_key: "forum.audit.result"
  ai_async_task_queue: "q-ai-async-task"
  ai_content_result_routing_key: "forum.ai.content.result"
  ai_im_result_routing_key: "forum.ai.im.result"
  prefetch: 1

postgres:
  host: postgres
  port: 5432
  user: langgraph
  password: ""
  db: langgraph_db
  auto_setup: true

audit:
  max_image_workers: 3
  task_state_key_prefix: "ai_audit:task_state:"
  task_state_ttl: 3600
  image_audit_timeout: 30
  text_audit_timeout: 45
  text_audit_max_chars: 12000
  video_audit_timeout: 120
  video_max_bytes_for_url: 104857600
  video_frame_extract_timeout: 120
  summary_min_len: 50

oss:
  endpoint: https://oss-cn-shenzhen.aliyuncs.com
  access_key_id: ""
  access_key_secret: ""
  bucket_name: ""
  url_prefix: ""
  root_prefix: ""

cache:
  exact_prefix: "ai_audit:cache:exact:"
  list_key: "ai_audit:text_list"
  ttl: 86400
  list_max: 100
  candidate_topk: 50
  semantic_threshold: 0.7

rag:
  redis_article_ids_key: "forum_rag:article:ids"
  redis_article_doc_prefix: "forum_rag:article:"
  redis_user_ids_key: "forum_rag:user:ids"
  redis_user_doc_prefix: "forum_rag:user:"
  vector_scan_limit: 800
  # 过约 1500 条稳定索引后再考虑 Redis Stack KNN
  max_candidates: 80
  doc_truncate: 1200
  relevance_threshold: 0.22
  top_n: 40
  rerank_weight: 0.72
  keyword_weight: 0.18
  embedding_weight: 0.10
  embedding_top_k: 50
  min_keyword_overlap: 0.08
  skip_rerank_below: 5
  light_rerank_weight: 0.55
  light_keyword_weight: 0.45
  light_rerank_top_n: 30
  vector_min_score: 0.22
  vector_min_score_user: 0.28
  vector_min_score_user_profile: 0.28
  vector_min_score_user_semantic: 0.40
  mascot_min_score: 0.42
  mascot_relative_to_top: 0.93
  mascot_top_min_to_show: 0.46
  mascot_score_gap: 0.055
  # 站内搜索字段权重：按实际可用字段重新归一化，三者是一组，改一个要一起看
  field_weight_title: 0.60
  field_weight_summary: 0.30
  field_weight_author: 0.10
  field_min_score: 0.22
  # 主题检索词扩展表：运营数据，加新主题不需要改代码。
  # 它同时作用于入库 embedding 文本与查询扩展两端，改动后历史向量与新查询口径会不一致，
  # 调整后请同步递增 topic_expansions_version 并评估是否重建文章向量索引。
  topic_expansions_version: 1
  topic_expansions:
    四川: ["四川", "川西", "四川西部", "川西高原", "甘孜", "阿坝"]
    川西: ["四川", "四川西部", "川西高原", "甘孜", "阿坝"]
    雪山: ["雪山", "雪峰", "高原雪景", "冰川"]
    西藏: ["西藏", "拉萨", "高原", "藏区"]
    新疆: ["新疆", "天山", "喀纳斯", "伊犁"]
    云南: ["云南", "大理", "丽江", "香格里拉"]
    旅行: ["旅行", "旅游", "出游", "攻略"]
    自驾: ["自驾", "自驾游", "公路旅行"]
    美食: ["美食", "探店", "好吃", "餐厅"]
    咖啡: ["咖啡", "咖啡馆", "拿铁"]
    猫: ["猫咪", "萌宠", "铲屎官"]
    狗: ["狗狗", "萌宠", "遛狗"]
    摄影: ["摄影", "旅拍", "扫街", "出片"]
    java: ["Java", "后端", "Spring"]
    python: ["Python", "爬虫", "数据分析"]
    前端: ["前端", "Vue", "React", "页面"]

image:
  max_bytes: 10485760
  allowed_formats: ["jpeg", "jpg", "png", "gif", "webp", "bmp"]

mascot:
  internal_key: ""
  max_user_message_len: 2000
  max_history_turns: 8

tavily:
  enabled: true
  api_key: ""
  max_results: 5
  search_depth: basic
  timeout: 25

mcp:
  enabled: true
  tools:
    - tavily_search
    - get_current_datetime

ai_hub:
  internal_key: ""

security:
  require_internal_key: true

ffmpeg:
  base_url: http://ffmpeg:8099
  internal_key: ""

forum:
  base_url: "http://gateway:10086"
  notice_list_path: "/notice/center/list"
  # 氛围标签候选集，真源在后端 Nacos forum.music.mood-tags
  music_mood_path: "/article/music/moods"
  request_timeout: 15
  site_help_cache_ttl: 600
  site_help_max_notice_chars: 4000
