# ai-server 本地开发配置（直连 deploy/docker-compose.dev.yaml 暴露的宿主机端口）
# 密钥勿写入本文件：本地使用 Windows 用户环境变量，生产由外部 prod.env 注入

server:
  host: 0.0.0.0
  port: 5000

logging:
  level: WARNING
  file: ../logs/ai-server/ai-server.log
  max_bytes: 20971520
  backup_count: 14

gateway:
  fast_concurrency: 8
  standard_concurrency: 4
  long_concurrency: 2
  index_concurrency: 2

dashscope:
  api_key: ""
  # qwen3.6 / qwen3-vl 需走 OpenAI 兼容端点（旧版 ChatTongyi 会报 url error）
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  # wan2.7 / 旧 z-image 文生图均走 multimodal-generation（现有 dashscope 域名仍可用）
  image_generation_url: "https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation"
  # Qwen3 的思考模式：显式钉死，不吃服务端默认值
  enable_thinking: false
  # 模型分配（名称以 Dashscope 控制台为准，可按环境微调）
  model_text: "qwen3.7-flash"                   # 文本审核 / 摘要（默认与 flash 对齐）
  model_text_flash: "qwen3.7-flash"             # 看板娘等低成本对话
  model_text_deep: "qwen3.7-max"                # 看板娘深度文本（VIP）
  model_vision: "qwen3-vl-flash"                # 图片审核（视觉，首选）
  model_vision_fallback: "qwen3-vl-plus"       # 视觉兜底（flash 无法处理时）
  # rerank 与 embedding 不可混用：rerank 只做搜索结果重排，不能生成向量
  model_rerank: "qwen3-rerank"                 # 站内文本 RAG 重排（TextReRank）
  model_embedding_rag: "qwen3-vl-embedding"    # RAG 多模态向量（MultiModalEmbedding，与对话 API 不同）
  model_embedding_text_fallback: "text-embedding-v4"  # MultiModal 失败时 TextEmbedding 降级
  model_image_normal: "wan2.7-image"            # 普通生图（万相 2.7 平衡档，默认 2K）
  model_image_premium: "wan2.7-image-pro"      # DashScope Wan 进阶生图
  model_omni: "qwen3-omni-flash"               # 用户上传歌曲音频理解/审核

redis:
  host: 127.0.0.1
  port: 16379
  password: ""
  db: 0
  socket_timeout: 2

rabbitmq:
  host: 127.0.0.1
  port: 56720
  virtual_host: forum-demo
  username: nuonuo
  password: ""
  # 与 Java 侧 RabbitMQConfigure 保持一致
  exchange: "t_exchange_1"
  audit_task_queue: "q-audit-article"
  audit_task_routing_key: "forum.audit.article"
  audit_result_routing_key: "forum.audit.result"
  ai_async_task_queue: "q-ai-async-task"
  ai_content_result_routing_key: "forum.ai.content.result"
  ai_im_result_routing_key: "forum.ai.im.result"
  # 异步任务消费线程数。prefetch 必须与之对齐：
  # 未确认消息数就是背压，prefetch 小于线程数会让线程闲着
  worker_threads: 4
  prefetch: 4

postgres:
  # LangGraph 检查点存储 (PostgresSaver), Docker 映射端口 54320 -> 容器内 5432
  # 容器初始化时设置 POSTGRES_USER=langgraph, POSTGRES_DB=langgraph_db
  host: 127.0.0.1
  port: 54320
  user: langgraph
  password: ""
  db: langgraph_db
  # PostgresSaver 首次启动自动 CREATE TABLE
  auto_setup: true
  # checkpointer 连接池上限；审核 worker 是多线程的
  pool_max_size: 8

audit:
  # LangGraph 单次审核内部最大并发图片审任务数 (cover + gallery 一并审)
  max_image_workers: 3
  # 任务幂等标记 key 前缀; 与 Java 侧 REDIS_KEY_AUDIT_TASK_STATE 保持一致
  task_state_key_prefix: "ai_audit:task_state:"
  # SETNX 标记 TTL (秒)
  task_state_ttl: 3600
  # 单图片审核超时
  image_audit_timeout: 30
  # 文本审核 LLM 读超时（秒）；配额充足仍可能因网络/长正文超时
  text_audit_timeout: 45
  # 送审正文最大字符（超出截断，避免 MC 长文拖垮审核）
  text_audit_max_chars: 12000
  video_audit_timeout: 120
  video_max_bytes_for_url: 104857600
  video_frame_extract_timeout: 120
  # 摘要生成最小正文长度 (低于此不调 LLM)
  summary_min_len: 50

oss:
  endpoint: https://oss-cn-shenzhen.aliyuncs.com
  access_key_id: ""
  access_key_secret: ""
  # 本地默认开发桶；Docker/生产由 FORUM_OSS_PROFILE + OSS_LOCAL_* / OSS_SERVER_* 覆盖
  bucket_name: item-for-picture-with-zhanglihong-local-develop
  url_prefix: https://item-for-picture-with-zhanglihong-local-develop.oss-cn-shenzhen.aliyuncs.com/
  root_prefix: ""

ffmpeg:
  base_url: http://127.0.0.1:8099
  internal_key: ""

# 本地开发：内网密钥可留空；生产 Docker 通过 AI_REQUIRE_INTERNAL_KEY=1 强制
security:
  require_internal_key: false

cache:
  # 文本语义近似缓存: 精确缓存命中后跳过 LLM
  exact_prefix: "ai_audit:cache:exact:"
  list_key: "ai_audit:text_list"
  ttl: 86400
  list_max: 100
  candidate_topk: 50
  semantic_threshold: 0.7

rag:
  redis_article_ids_key: "forum_rag:article:ids"
  redis_article_doc_prefix: "forum_rag:article:"
  redis_user_ids_key: "forum_rag:user:ids"
  redis_user_doc_prefix: "forum_rag:user:"
  vector_scan_limit: 800
  # 过约 1500 条稳定索引后再考虑 Redis Stack KNN；当前暴力扫描 + pipeline 足够
  max_candidates: 80
  doc_truncate: 1200
  relevance_threshold: 0.22
  top_n: 40
  # 融合 rerank 与关键词/向量预筛（0~1 权重，越大越信 rerank）
  rerank_weight: 0.72
  keyword_weight: 0.18
  embedding_weight: 0.10
  embedding_top_k: 50
  min_keyword_overlap: 0.08
  # 站内搜索 light 模式：省 embedding，候选少时仅关键词打分
  skip_rerank_below: 5
  light_rerank_weight: 0.55
  light_keyword_weight: 0.45
  light_rerank_top_n: 30
  vector_min_score: 0.22
  vector_min_score_user: 0.28
  vector_min_score_user_profile: 0.28
  vector_min_score_user_semantic: 0.40
  mascot_min_score: 0.42
  mascot_relative_to_top: 0.93
  mascot_top_min_to_show: 0.46
  mascot_score_gap: 0.055
  # 站内搜索字段权重：按实际可用字段重新归一化，三者是一组，改一个要一起看
  field_weight_title: 0.60
  field_weight_summary: 0.30
  field_weight_author: 0.10
  field_min_score: 0.22
  # 主题检索词扩展表：运营数据，加新主题不需要改代码。
  # 它同时作用于入库 embedding 文本与查询扩展两端，改动后历史向量与新查询口径会不一致，
  # 调整后请同步递增 topic_expansions_version 并评估是否重建文章向量索引。
  topic_expansions_version: 1
  topic_expansions:
    四川: ["四川", "川西", "四川西部", "川西高原", "甘孜", "阿坝"]
    川西: ["四川", "四川西部", "川西高原", "甘孜", "阿坝"]
    雪山: ["雪山", "雪峰", "高原雪景", "冰川"]
    西藏: ["西藏", "拉萨", "高原", "藏区"]
    新疆: ["新疆", "天山", "喀纳斯", "伊犁"]
    云南: ["云南", "大理", "丽江", "香格里拉"]
    旅行: ["旅行", "旅游", "出游", "攻略"]
    自驾: ["自驾", "自驾游", "公路旅行"]
    美食: ["美食", "探店", "好吃", "餐厅"]
    咖啡: ["咖啡", "咖啡馆", "拿铁"]
    猫: ["猫咪", "萌宠", "铲屎官"]
    狗: ["狗狗", "萌宠", "遛狗"]
    摄影: ["摄影", "旅拍", "扫街", "出片"]
    java: ["Java", "后端", "Spring"]
    python: ["Python", "爬虫", "数据分析"]
    前端: ["前端", "Vue", "React", "页面"]

image:
  max_bytes: 10485760  # 10MB
  allowed_formats: ["jpeg", "jpg", "png", "gif", "webp", "bmp"]

# 看板娘对话 (由 Java BFF 转发; 可选内网密钥, 与 forum.mascot.internal-key 对齐)
# 密钥留空则不校验 X-Internal-Key; 也可用环境变量 MASCOT_INTERNAL_KEY 覆盖
mascot:
  internal_key: ""
  max_user_message_len: 2000
  # 送进模型的历史消息条数（不是轮数）。与 Java 的 forum.mascot.history-exchanges
  # 对齐：8 轮问答 = 16 条消息。改一个要一起改。
  max_history_messages: 16

# Tavily 联网搜索（MCP 工具 tavily_search）；密钥用环境变量 TAVILY_API_KEY
tavily:
  enabled: true
  api_key: ""
  max_results: 5
  search_depth: basic
  timeout: 25

# MCP 工具（看板娘 / 生图按需调用）
mcp:
  enabled: true
  tools:
    - tavily_search
    - get_current_datetime

# Java BFF 调用 /api/v1/ai/* 时校验 X-Internal-Key；可与 mascot 共用 MASCOT_INTERNAL_KEY
ai_hub:
  internal_key: ""

# Java 论坛后端（看板娘站点帮助语料来源：公告中心已发布列表）
forum:
  # 统一走网关；用 127.0.0.1 避免 Windows 上 localhost 解析到 ::1
  base_url: "http://127.0.0.1:10086"
  notice_list_path: "/notice/center/list"
  # 氛围标签候选集，真源在后端 Nacos forum.music.mood-tags
  music_mood_path: "/article/music/moods"
  request_timeout: 15
  site_help_cache_ttl: 600
  site_help_max_notice_chars: 4000
