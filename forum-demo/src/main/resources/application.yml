server:
  port: 10086
spring:
  #  profiles:
  #    active: prod  # 生产环境激活，本地开发时改为 dev 或注释掉此行
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:33061/forum_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456789}
  data:
    redis:
      host: localhost
      port: 63790
      password: ${REDIS_PASSWORD:123456}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  # 邮箱服务
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME:noreply@example.com}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: NON_NULL
  servlet:
    multipart:
      # 服务器硬上限: 单文件 30MB, 单请求 30MB
      # 业务侧期望 ≤ 5MB, 5~30MB 区间会在 FileServiceImpl 内部走 thumbnailator 自动压缩
      max-file-size: 30MB
      max-request-size: 30MB
  rabbitmq:
    host: localhost
    port: 56720
    virtual-host: forum-demo
    username: nuonuo
    password: 123456
    listener:
      simple:
        acknowledge-mode: manual
    publisher-confirm-type: correlated
# 注: Postgres 17 仅供 Python LangGraph checkpoint 使用, Java 端不直接连;
# 连接参数维护在 ai-server/config.yaml. 修改后只需重启 ai-server 即可.
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.forumdemo.common.db
  configuration:
    map-underscore-to-camel-case: true
    # 启用插件执行器的支持，但不能在 yml 中直接启用分页，需要用 Java 配置
  global-config:
    db-config:
      id-type: auto
springdoc:
  swagger-ui:
    path: /swagger
sms:
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  sign-name: "速通互联验证码"

# 阿里云 OSS 配置
oss:
  endpoint: https://oss-cn-shenzhen.aliyuncs.com
  access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:your-forum-oss-bucket}
  url-prefix: ${OSS_URL_PREFIX:https://your-forum-oss-bucket.oss-cn-shenzhen.aliyuncs.com/}
  path: forum_db_item/forum_head_picture/

jwt:
  secret: ${JWT_SECRET:local_dev_jwt_secret_min_32_chars_change_me}

# 敏感信息加密 / HMAC 密钥，AES-GCM 加密手机号/邮箱，HMAC-SHA256 用于等值查询
# 上线前请替换成更长的随机字符串，并使用 PII_CRYPTO_SECRET 环境变量覆盖
pii:
  secret: ${PII_CRYPTO_SECRET:local_dev_pii_secret_min_32_chars_change_me}

# 行为验证码（cloud.tianai.captcha），详细属性见 ImageCaptchaProperties
# 背景图 classpath 路径见 CaptchaResourceConfiguration；模板默认 600x360，大图可能被缩放
captcha:
  prefix: captcha
  expire:
    default: 120000
    WORD_IMAGE_CLICK: 180000
  init-default-resource: true
  local-cache-enabled: false
  local-cache-size: 20
  local-cache-wait-time: 5000
  local-cache-period: 2000
  local-cache-ignored-cache-fields: ""
  # 文字点选需自定义字体时，将 SimHei.ttf 放到 src/main/resources/font/ 后取消下行注释
  # font-path:
  #   - classpath:font/SimHei.ttf
  secondary:
    enabled: false
    expire: 120000
    keyPrefix: "captcha:secondary"

# 看板娘 (Vue -> Java -> Python ai-server). 密钥与 URL 请按环境自行填写.
forum:
  mascot:
    ai-url: ${FORUM_MASCOT_AI_URL:http://localhost:5000/api/v1/mascot/chat}
    internal-key: ${FORUM_MASCOT_INTERNAL_KEY:}
    basic-daily-limit: ${FORUM_MASCOT_BASIC_DAILY_LIMIT:30}
    # 小项目占位: isAdmin=1 视为 VIP, 不做真实会员表
    treat-admin-as-vip: ${FORUM_MASCOT_TREAT_ADMIN_AS_VIP:true}
  # AI Hub (Java BFF -> ai-server /api/v1/ai/*). 密钥可与看板娘共用或单独配置.
  ai:
    hub-base-url: ${FORUM_AI_HUB_BASE_URL:http://localhost:5000}
    internal-key: ${FORUM_AI_INTERNAL_KEY:${FORUM_MASCOT_INTERNAL_KEY:}}
