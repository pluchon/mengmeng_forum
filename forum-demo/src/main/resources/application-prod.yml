server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/forum_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:forum_user}
    password: ${SPRING_DATASOURCE_PASSWORD:123456789}

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:123456}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: NON_NULL

  servlet:
    multipart:
      # 与 nginx client_max_body_size(350m) 对齐；视频 >100MB 走 ffmpeg 压缩后再上传 OSS
      max-file-size: 350MB
      max-request-size: 350MB

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:forum-demo}
    username: ${SPRING_RABBITMQ_USERNAME:nuonuo}
    password: ${SPRING_RABBITMQ_PASSWORD:123456}
    listener:
      simple:
        acknowledge-mode: manual
    publisher-confirm-type: correlated

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: org.example.forumdemo.common.db
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    # 生产环境建议关闭 swagger，防止接口信息泄露
    enabled: false

pii:
  secret: ${PII_CRYPTO_SECRET}

# 行为验证码（与 application.yml 对齐）
captcha:
  prefix: captcha
  expire:
    default: 120000
    WORD_IMAGE_CLICK: 180000
  init-default-resource: true
  local-cache-enabled: false
  local-cache-size: 20
  local-cache-wait-time: 5000
  local-cache-period: 2000
  local-cache-ignored-cache-fields: ""
  secondary:
    enabled: false
    expire: 120000
    keyPrefix: "captcha:secondary"

logging:
  level:
    root: WARN
    org.example.forumdemo: INFO
  # 生产容器用控制台日志，避免挂载 logs/backend 时 uid 1000 无写权限
