# 萌萌论坛单机微服务部署：Nginx -> Gateway -> 六个业务域服务。
# Nacos 只暴露在 forum-net 内，服务通过 NACOS_ADDR 进行发现与配置读取。

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  FORUM_LOG_DIR: /app/logs
  # 容器内必须用 Compose 服务名；外部环境文件中的本机地址不应覆盖这里
  NACOS_ADDR: nacos:8848
  NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
  NACOS_GROUP: ${NACOS_GROUP:-FORUM}
  FORUM_MASCOT_INTERNAL_KEY: ${FORUM_MASCOT_INTERNAL_KEY:-}
  FORUM_AI_INTERNAL_KEY: ${FORUM_AI_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
  FORUM_FFMPEG_INTERNAL_KEY: ${FORUM_FFMPEG_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
  FORUM_AI_HUB_BASE_URL: http://ai-server:5000
  FORUM_MASCOT_AI_URL: http://ai-server:5000/api/v1/gateway/invoke
  FORUM_FFMPEG_URL: http://ffmpeg:8099
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: 6379
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
  SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-forum-demo}
  PII_CRYPTO_SECRET: ${PII_CRYPTO_SECRET:-}
  JWT_SECRET: ${JWT_SECRET:-}
  ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
  ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
  FORUM_OSS_PROFILE: server
  OSS_SERVER_ENDPOINT: ${OSS_SERVER_ENDPOINT:-https://oss-cn-shenzhen.aliyuncs.com}
  OSS_SERVER_ACCESS_KEY_ID: ${OSS_SERVER_ACCESS_KEY_ID:-${ALIYUN_ACCESS_KEY_ID:-}}
  OSS_SERVER_ACCESS_KEY_SECRET: ${OSS_SERVER_ACCESS_KEY_SECRET:-${ALIYUN_ACCESS_KEY_SECRET:-}}
  OSS_SERVER_BUCKET_NAME: ${OSS_SERVER_BUCKET_NAME:-item-for-picture-with-zhanglihong}
  OSS_SERVER_URL_PREFIX: ${OSS_SERVER_URL_PREFIX:-https://item-for-picture-with-zhanglihong.oss-cn-shenzhen.aliyuncs.com/}
  OSS_SERVER_ROOT_PREFIX: ${OSS_SERVER_ROOT_PREFIX:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  "JM.LOG.RETAIN.COUNT": ${NACOS_LOG_RETAIN_COUNT:-7}
  "JM.LOG.FILE.SIZE": ${NACOS_LOG_FILE_SIZE:-20MB}
  "com.alibaba.nacos.config.log.level": ${NACOS_LOG_LEVEL:-warn}
  "com.alibaba.nacos.log.level": ${NACOS_LOG_LEVEL:-warn}
  "com.alibaba.nacos.naming.log.level": ${NACOS_LOG_LEVEL:-warn}
  "com.alibaba.nacos.ai.log.level": ${NACOS_LOG_LEVEL:-warn}

x-java-service: &java-service
  image: ${FORUM_BACKEND_IMAGE:-forum-backend:latest}
  restart: unless-stopped
  entrypoint: ["java", "-Xms${JAVA_XMS:-128m}", "-Xmx${JAVA_XMX:-256m}", "-Dlogging.config=classpath:forum-logback-spring.xml", "-jar"]
  environment: *java-env
  volumes:
    - ${FORUM_LOG_DIR:-../logs}/java-backend:/app/logs
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    nacos:
      condition: service_started
  networks:
    - forum-net

services:
  nginx:
    image: nginx:1.30.1
    container_name: forum-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./dist/user:/usr/share/nginx/user:ro
      - ${FORUM_LOG_DIR:-../logs}/nginx:/var/log/nginx
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/nginx.pid && kill -0 $(cat /var/run/nginx.pid)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - forum-net

  gateway:
    <<: *java-service
    container_name: forum-gateway
    command: ["/app/gateway.jar"]
    entrypoint: ["java", "-Xms${GATEWAY_JAVA_XMS:-96m}", "-Xmx${GATEWAY_JAVA_XMX:-192m}", "-Dlogging.config=classpath:forum-logback-spring.xml", "-jar"]
    environment:
      <<: *java-env
      "JM.LOG.PATH": /app/logs/forum-gateway
    healthcheck:
      test: ["CMD-SHELL", "/bin/busybox nc -z 127.0.0.1 10086"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  auth:
    <<: *java-service
    container_name: forum-auth
    command: ["/app/auth-server.jar"]
    environment:
      <<: *java-env
      FORUM_AUTH_DB_URL: jdbc:mysql://mysql:3306/forum_auth_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      FORUM_AUTH_DB_USERNAME: ${FORUM_AUTH_DB_USERNAME:-forum_auth}
      FORUM_AUTH_DB_PASSWORD: ${FORUM_AUTH_DB_PASSWORD:-}
      "JM.LOG.PATH": /app/logs/forum-auth

  content:
    <<: *java-service
    container_name: forum-content
    command: ["/app/content-server.jar"]
    environment:
      <<: *java-env
      FORUM_CONTENT_DB_URL: jdbc:mysql://mysql:3306/forum_content_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      FORUM_CONTENT_DB_USERNAME: ${FORUM_CONTENT_DB_USERNAME:-forum_content}
      FORUM_CONTENT_DB_PASSWORD: ${FORUM_CONTENT_DB_PASSWORD:-}
      "JM.LOG.PATH": /app/logs/forum-content
    entrypoint: ["java", "-Xms${JAVA_XMS:-128m}", "-Xmx${CONTENT_JAVA_XMX:-384m}", "-Dlogging.config=classpath:forum-logback-spring.xml", "-Dcsp.sentinel.log.dir=/app/logs/forum-content/sentinel", "-jar"]

  im:
    <<: *java-service
    container_name: forum-im
    command: ["/app/im-server.jar"]
    environment:
      <<: *java-env
      FORUM_IM_DB_URL: jdbc:mysql://mysql:3306/forum_im_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      FORUM_IM_DB_USERNAME: ${FORUM_IM_DB_USERNAME:-forum_im}
      FORUM_IM_DB_PASSWORD: ${FORUM_IM_DB_PASSWORD:-}
      "JM.LOG.PATH": /app/logs/forum-im

  game:
    <<: *java-service
    container_name: forum-game
    command: ["/app/game-server.jar"]
    environment:
      <<: *java-env
      FORUM_GAME_DB_URL: jdbc:mysql://mysql:3306/forum_game_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      FORUM_GAME_DB_USERNAME: ${FORUM_GAME_DB_USERNAME:-forum_game}
      FORUM_GAME_DB_PASSWORD: ${FORUM_GAME_DB_PASSWORD:-}
      "JM.LOG.PATH": /app/logs/forum-game
    entrypoint: ["java", "-Xms${JAVA_XMS:-128m}", "-Xmx${GAME_JAVA_XMX:-384m}", "-Dlogging.config=classpath:forum-logback-spring.xml", "-Dcsp.sentinel.log.dir=/app/logs/forum-game/sentinel", "-jar"]

  economy:
    <<: *java-service
    container_name: forum-economy
    command: ["/app/economy-server.jar"]
    environment:
      <<: *java-env
      FORUM_ECONOMY_DB_URL: jdbc:mysql://mysql:3306/forum_economy_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      FORUM_ECONOMY_DB_USERNAME: ${FORUM_ECONOMY_DB_USERNAME:-forum_economy}
      FORUM_ECONOMY_DB_PASSWORD: ${FORUM_ECONOMY_DB_PASSWORD:-}
      "JM.LOG.PATH": /app/logs/forum-economy

  ai:
    <<: *java-service
    container_name: forum-ai
    command: ["/app/ai-server.jar"]
    environment:
      <<: *java-env
      FORUM_AI_DB_URL: jdbc:mysql://mysql:3306/forum_ai_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
      FORUM_AI_DB_USERNAME: ${FORUM_AI_DB_USERNAME:-forum_ai}
      FORUM_AI_DB_PASSWORD: ${FORUM_AI_DB_PASSWORD:-}
      "JM.LOG.PATH": /app/logs/forum-ai
    entrypoint: ["java", "-Xms${JAVA_XMS:-128m}", "-Xmx${AI_JAVA_XMX:-384m}", "-Dlogging.config=classpath:forum-logback-spring.xml", "-Dcsp.sentinel.log.dir=/app/logs/forum-ai/sentinel", "-jar"]

  ai-server:
    image: ${FORUM_AI_IMAGE:-forum-ai-server:latest}
    container_name: forum-ai-server
    restart: unless-stopped
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MASCOT_INTERNAL_KEY: ${FORUM_MASCOT_INTERNAL_KEY:-}
      AI_HUB_INTERNAL_KEY: ${FORUM_AI_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
      AI_REQUIRE_INTERNAL_KEY: ${AI_REQUIRE_INTERNAL_KEY:-1}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-forum-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      FORUM_OSS_PROFILE: server
      OSS_SERVER_ENDPOINT: ${OSS_SERVER_ENDPOINT:-https://oss-cn-shenzhen.aliyuncs.com}
      OSS_SERVER_ACCESS_KEY_ID: ${OSS_SERVER_ACCESS_KEY_ID:-${ALIYUN_ACCESS_KEY_ID:-}}
      OSS_SERVER_ACCESS_KEY_SECRET: ${OSS_SERVER_ACCESS_KEY_SECRET:-${ALIYUN_ACCESS_KEY_SECRET:-}}
      OSS_SERVER_BUCKET_NAME: ${OSS_SERVER_BUCKET_NAME:-item-for-picture-with-zhanglihong}
      OSS_SERVER_URL_PREFIX: ${OSS_SERVER_URL_PREFIX:-https://item-for-picture-with-zhanglihong.oss-cn-shenzhen.aliyuncs.com/}
      OSS_SERVER_ROOT_PREFIX: ${OSS_SERVER_ROOT_PREFIX:-}
      FORUM_FFMPEG_URL: http://ffmpeg:8099
      FORUM_BACKEND_BASE_URL: http://gateway:10086
    volumes:
      - ${FORUM_LOG_DIR:-../logs}:/var/log/forum
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - forum-net

  ffmpeg:
    image: ${FORUM_FFMPEG_IMAGE:-forum-ffmpeg:latest}
    container_name: forum-ffmpeg
    restart: unless-stopped
    environment:
      FFMPEG_INTERNAL_KEY: ${FORUM_FFMPEG_INTERNAL_KEY:-${FORUM_MASCOT_INTERNAL_KEY:-}}
      FFMPEG_REQUIRE_INTERNAL_KEY: ${FFMPEG_REQUIRE_INTERNAL_KEY:-1}
      FORUM_OSS_PROFILE: server
      OSS_SERVER_URL_PREFIX: ${OSS_SERVER_URL_PREFIX:-https://item-for-picture-with-zhanglihong.oss-cn-shenzhen.aliyuncs.com/}
      FFMPEG_LOG_FILE: /var/log/forum/ffmpeg/ffmpeg.log
    volumes:
      - ${FORUM_LOG_DIR:-../logs}/ffmpeg:/var/log/forum/ffmpeg
    networks:
      - forum-net

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: forum-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # 仅满足 Nacos 3.x 镜像的启动要求；保持客户端鉴权关闭。
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-}
    volumes:
      - forum_nacos_data:/home/nacos/data
    networks:
      - forum-net

  mysql:
    image: mysql:9.7.0
    container_name: forum-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_USER: ${MYSQL_USER:-forum_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      TZ: Asia/Taipei
    command: ["--default-time-zone=+08:00"]
    volumes:
      - forum_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - forum-net

  redis:
    image: redis:8.0
    container_name: forum-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - forum_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-net

  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: forum-rabbitmq
    hostname: forum-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-forum-demo}
    volumes:
      - forum_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - forum-net

  postgres:
    image: postgres:17
    container_name: forum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-langgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    volumes:
      - forum_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-langgraph} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forum-net

volumes:
  forum_nacos_data:
  forum_mysql_data:
  forum_redis_data:
  forum_rabbitmq_data:
  forum_postgres_data:

networks:
  forum-net:
    driver: bridge
