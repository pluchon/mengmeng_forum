# 生产 HTTPS — www.nuonuoya.cn（用户端）
# 用户端证书：ssl/www.nuonuoya.cn.pem + ssl/www.nuonuoya.cn.key

# 容器内健康检查（不依赖域名）
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name nuonuoya.cn www.nuonuoya.cn;
    return 301 https://$host$request_uri;
}

# 根域名 → www
server {
    listen 443 ssl;
    http2 on;
    server_name nuonuoya.cn;

    ssl_certificate     /etc/nginx/ssl/www.nuonuoya.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.nuonuoya.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://www.nuonuoya.cn$request_uri;
}

# ================== 用户端 ==================
server {
    listen 443 ssl;
    http2 on;
    server_name www.nuonuoya.cn;

    ssl_certificate     /etc/nginx/ssl/www.nuonuoya.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.nuonuoya.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 350m;

    set $forum_spa_root /usr/share/nginx/user;

    include /etc/nginx/conf.d/snippets/forum-api.inc;
    include /etc/nginx/conf.d/snippets/forum-spa.inc;
}
