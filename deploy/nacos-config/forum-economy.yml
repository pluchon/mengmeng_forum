spring:
  datasource:
    url: ${FORUM_ECONOMY_DB_URL:jdbc:mysql://127.0.0.1:33306/forum_economy_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}
    username: ${FORUM_ECONOMY_DB_USERNAME:forum_economy}
    password: ${FORUM_ECONOMY_DB_PASSWORD}

forum:
  domain: economy
  features:
    scheduling: false
    mq: false
    mq-consumer: false
    websocket: false
    game-runtime: false

  payment:
    # 模拟渠道的回调验签密钥。接入真实渠道后各家自带自己的密钥配置，这条保留给本地联调
    mock:
      secret: ${FORUM_PAYMENT_MOCK_SECRET:forum-mock-payment-secret}
    # 待支付订单超时关闭的分钟数。它同时是"挂单不付、等续费后再付"那套白嫖手法的第一道防线
    order-timeout-minutes: 30
