spring:
  datasource:
    url: ${FORUM_AI_DB_URL:jdbc:mysql://127.0.0.1:33306/forum_ai_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}
    username: ${FORUM_AI_DB_USERNAME:forum_ai}
    password: ${FORUM_AI_DB_PASSWORD}

server:
  tomcat:
    # 仅 ai 域：content→forum-ai 的 image-payload JSON（Base64）需大于默认 2MB
    max-http-post-size: 41943040
    max-swallow-size: 41943040

forum:
  domain: ai
  features:
    # 打开是为了看板娘牵线的匹配任务（每天 4:20）；ai 域此前没有任何 @Scheduled
    scheduling: true
    mq: false
    mq-consumer: false
    websocket: false
    game-runtime: false
  ai:
    rag:
      # 与 ai-server（Python）config.yaml 的 rag 段对应，但两侧各自独立生效。
      # article-search-min-score 保持 0.20（当前线上真实值），
      # Python 侧 rag.vector_min_score 是 0.22，两者历史上已漂移；
      # 若要统一请两边一起改，不要只动一侧。
      article-search-min-score: 0.20
      mascot-min-score: 0.42
      mascot-top-min-to-show: 0.46
      mascot-high-score-bypass: 0.52
