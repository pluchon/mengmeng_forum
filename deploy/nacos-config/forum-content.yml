spring:
  datasource:
    url: ${FORUM_CONTENT_DB_URL:jdbc:mysql://127.0.0.1:33306/forum_content_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true}
    username: ${FORUM_CONTENT_DB_USERNAME:forum_content}
    password: ${FORUM_CONTENT_DB_PASSWORD}
  cloud:
    openfeign:
      client:
        config:
          contentAiHubInternalFeignClient:
            connect-timeout: 5000
            # 标签推荐等 AI 调用，与前端 / gateway 对齐
            read-timeout: 300000

forum:
  domain: content
  features:
    scheduling: true
    mq: true
    mq-consumer: true
    websocket: false
    game-runtime: false
  report:
    # 歌曲举报累计到几个不同用户才送 AI 复审。
    # 帖子/评论违规要快速处理所以是单人直通，歌曲不急——
    # 单人举报直通 AI 等于把成本敞开给任何人
    music-ai-threshold: 3
    # 每人每天最多提交几条举报
    daily-limit: 20
    # 近 30 天被判失实多少次后暂停举报资格
    rejected-block: 5
  search:
    # 相关度阈值：需要按召回效果反复调参，改这里重启即可，不必重新编译。
    # ai-server 的 config.yaml 里有一组同类阈值各自独立生效，调参时两边一起看。
    article-hybrid-min-score: 0.22
    article-vector-min-score: 0.36
    article-author-vector-min-score: 0.72
    user-vector-min-score: 0.38
    recommend-vector-min-score: 0.30
  music:
    # 氛围标签候选集，是前端筛选栏、投稿快选与 ai-server 审核提示词的唯一来源。
    # 它不是白名单：AI 允许补充新标签、用户上传可自由输入，入库侧不按此列表拦截。
    # 首项「热门」是默认态而非氛围，曲库筛选时被当作不过滤处理。
    mood-tags: 热门,治愈,清新,浪漫,轻松,深夜,轻音乐,适合配图
