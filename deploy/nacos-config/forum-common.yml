spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:16379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:56720}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:forum-demo}
    username: ${SPRING_RABBITMQ_USERNAME:nuonuo}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD}}
    listener:
      simple:
        acknowledge-mode: manual
    publisher-confirm-type: correlated
  mail:
    host: smtp.qq.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Taipei
    default-property-inclusion: NON_NULL
  servlet:
    multipart:
      max-file-size: 350MB
      max-request-size: 350MB
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 60000
            logger-level: basic

logging:
  level:
    root: WARN
    org.pluchon.forum: WARN

forum:
  service:
    internal-key: ${FORUM_SERVICE_INTERNAL_KEY:local-dev-forum-service-key}
  websocket:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  mascot:
    ai-url: ${FORUM_MASCOT_AI_URL:http://127.0.0.1:5000/api/v1/gateway/invoke}
    internal-key: ${FORUM_MASCOT_INTERNAL_KEY:${FORUM_AI_INTERNAL_KEY}}
    basic-daily-limit: ${FORUM_MASCOT_BASIC_DAILY_LIMIT:30}
    treat-admin-as-vip: ${FORUM_MASCOT_TREAT_ADMIN_AS_VIP:true}
    complexity:
      # 命中即把 VIP Pro 会话升级到更贵的深度模型，直接影响 AI 成本。
      # 放宽会增加深度模型调用量，收紧会降低回答质量，改动前评估用量。
      direct-length-threshold: 320
      min-indicators: 2
      history-turns-threshold: 4
      history-length-threshold: 120
      keywords: 深入分析,详细分析,对比,比较,方案,规划,计划,推理,论证,优缺点,多步,教程,长文,大纲
      strong-keywords: 帮我写一篇,制定一个
  ai:
    hub-base-url: ${FORUM_AI_HUB_BASE_URL:http://127.0.0.1:5000}
    internal-key: ${FORUM_AI_INTERNAL_KEY:${FORUM_MASCOT_INTERNAL_KEY}}
    timeout:
      connect-ms: 5000
      fast-ms: 60000
      # 润色 / 标签推荐等标准 AI 调用（多轮 LLM，允许约 5 分钟）
      standard-ms: 300000
      # 配图 / 生图等长调用
      long-ms: 300000
      index-ms: 50000
  ffmpeg:
    internal-key: ${FORUM_FFMPEG_INTERNAL_KEY:${FORUM_MASCOT_INTERNAL_KEY}}
    connect-timeout-ms: 5000
    read-timeout-ms: 150000
